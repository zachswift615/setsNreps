version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: setsnreps-backend
    ports:
      - "8000:8000"
    volumes:
      - ./setsNreps:/app
      - backend-static:/app/static
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    networks:
      - setsnreps-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/admin/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: setsnreps-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./setsNreps:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - setsnreps-network
    stdin_open: true
    tty: true

networks:
  setsnreps-network:
    driver: bridge

volumes:
  backend-static:
